# Modified by SysopBP, 2026-10-14: pin workflow dependencies to verified commits.
on:
  workflow_call:
    inputs:
      build-type:
        type: string
        required: true
    outputs:
      filename:
        description: "artifact file name"
        value: ${{ jobs.build-apk.outputs.filename }}
    secrets:
      key-alias:
        required: false
      keystore:
        required: false
      key-password:
        required: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.build_apk.outputs.upload_filename }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /usr/local/lib/android
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties' )}}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up OpenJDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "zulu"
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - name: Install required platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Replace android.jar
        run: |
          set -euo pipefail
          jar_tmp="$(mktemp)"
          trap 'rm -f "$jar_tmp"' EXIT
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/Reginer/aosp-android-jar/8b2da3b5cd735d32dcf69ac9d27de52033d5945d/android-36/android.jar' \
            --output "$jar_tmp"
          test "$(git hash-object "$jar_tmp")" = 'd6f9fc3f860634b05c64b1c67c12fc06b650cbdd'
          unzip -tq "$jar_tmp"
          install -m 644 "$jar_tmp" /usr/local/lib/android/sdk/platforms/android-36/android.jar
      - name: Verify XML draft edits
        run: |
          mkdir -p /tmp/ims-xml-check
          javac -d /tmp/ims-xml-check app/src/main/java/dev/bluehouse/enablevolte/XmlDraftEditor.java ci/XmlDraftCheck.java
          java -cp /tmp/ims-xml-check XmlDraftCheck
      - name: Build APK
        id: build_apk
        run: |
          if [[ "${BUILD_TYPE}" = "release" ]]; then
            ./gradlew assembleRelease
            echo "upload_filename=${RUN_ID}-APK" >> $GITHUB_OUTPUT
            echo "build_filename=app-release-unsigned.apk" >> $GITHUB_OUTPUT
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk dev.bluehouse.enablevolte.apk
            echo "upload_filename=${RUN_ID}.debug.apk" >> $GITHUB_OUTPUT
            echo "build_filename=app-debug.apk" >> $GITHUB_OUTPUT
          fi
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
          RUN_ID: ${{ github.run_id }}
      - name: Verify packaged root and observer routes
        run: python3 ci/check_apk.py
      - name: align APK with zipalign
        if: ${{ inputs.build-type == 'release' }}
        run: $ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign -v -p 4 app/build/outputs/apk/${BUILD_TYPE}/${FILENAME} app-unsigned-aligned.apk
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
          FILENAME: ${{ steps.build_apk.outputs.build_filename }}
      - name: Save keystore as file
        if: ${{ inputs.build-type == 'release' }}
        run: echo "${KEYSTORE_B64}" | base64 -d > keystore.jks
        env:
          KEYSTORE_B64: ${{ secrets.keystore }}
      - name: Sign APK
        run: echo "${KEY_PASSWORD}" | $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign --ks keystore.jks --ks-key-alias "${KEY_ALIAS}" --key-pass "env:KEY_PASSWORD" --out dev.bluehouse.enablevolte.apk app-unsigned-aligned.apk
        env:
          KEY_ALIAS: ${{ secrets.key-alias }}
          KEY_PASSWORD: ${{ secrets.key-password }}
          BUILD_TYPE: ${{ inputs.build-type }}
        if: ${{ inputs.build-type == 'release' && env.KEY_PASSWORD != '' }}
      - name: Rename APK
        run: mv app-unsigned-aligned.apk dev.bluehouse.enablevolte.apk
        env:
          KEY_PASSWORD: ${{ secrets.key-password }}
        if: ${{ inputs.build-type == 'release' && env.KEY_PASSWORD == '' }}
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.build_apk.outputs.upload_filename }}
          path: dev.bluehouse.enablevolte.apk
          retention-days: 3

      - name: Remove signing material
        if: always()
        run: rm -f keystore.jks
