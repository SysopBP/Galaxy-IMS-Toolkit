on:
  workflow_call:
    inputs:
      build-type:
        type: string
        required: true
    outputs:
      filename:
        description: "artifact file name"
        value: ${{ jobs.build-apk.outputs.filename }}
    secrets:
      key-alias:
        required: false
      keystore:
        required: false
      key-password:
        required: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.build_apk.outputs.upload_filename }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties' )}}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install required platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Install verified full framework API stubs
        run: |
          set -euo pipefail
          SDK_JAR="$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/Reginer/aosp-android-jar/main/android-36/android.jar" \
            -o /tmp/android-full-api.jar
          test "$(stat -c%s /tmp/android-full-api.jar)" -gt 1000000
          unzip -t /tmp/android-full-api.jar >/dev/null
          unzip -l /tmp/android-full-api.jar | grep -q 'android/os/ServiceManager.class'
          cp /tmp/android-full-api.jar "$SDK_JAR"
          unzip -t "$SDK_JAR" >/dev/null
      - name: Build APK
        id: build_apk
        run: |
          if [[ "${BUILD_TYPE}" = "release" ]]; then
            ./gradlew assembleRelease
            echo "upload_filename=${RUN_ID}-APK" >> $GITHUB_OUTPUT
            echo "build_filename=app-release-unsigned.apk" >> $GITHUB_OUTPUT
          else
            ./gradlew assembleDebug
            echo "upload_filename=${RUN_ID}.debug.apk" >> $GITHUB_OUTPUT
            echo "build_filename=app-debug.apk" >> $GITHUB_OUTPUT
          fi
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
          RUN_ID: ${{ github.run_id }}
      - name: Sign and verify APK
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
          FILENAME: ${{ steps.build_apk.outputs.build_filename }}
          KEYSTORE_B64: ${{ secrets.keystore }}
          KEY_ALIAS: ${{ secrets.key-alias }}
          KEY_PASSWORD: ${{ secrets.key-password }}
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          SOURCE="app/build/outputs/apk/${BUILD_TYPE}/${FILENAME}"
          if [[ "$BUILD_TYPE" == "debug" ]]; then
            # Gradle's debug APK is already signed with the debug certificate.
            cp "$SOURCE" dev.bluehouse.enablevolte.apk
          else
            if [[ -z "$KEYSTORE_B64" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
              echo "::error::Release signing secrets are required"
              exit 1
            fi
            printf '%s' "$KEYSTORE_B64" | base64 -d > keystore.jks
            "$TOOLS/zipalign" -v -p 4 "$SOURCE" app-aligned.apk
            "$TOOLS/apksigner" sign --ks keystore.jks --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEY_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out dev.bluehouse.enablevolte.apk app-aligned.apk
          fi
          "$TOOLS/apksigner" verify --verbose --print-certs dev.bluehouse.enablevolte.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_apk.outputs.upload_filename }}
          path: dev.bluehouse.enablevolte.apk
          retention-days: 3
