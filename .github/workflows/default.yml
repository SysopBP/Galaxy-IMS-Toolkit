# Modified by SysopBP, 2026-10-14: pin workflow dependencies to verified commits.
name: Tagged Release

on:
  push:
    tags:
      - 'v*'
permissions:
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.7.1/ktlint && chmod a+x ktlint && sudo mv ktlint /usr/local/bin/
      - name: Autoformat Kotlin sources in CI workspace
        run: ktlint --format
      - name: run ktlint
        run: |
          ktlint --reporter=checkstyle,output=build/ktlint-report.xml
        continue-on-error: true
      - uses: yutailang0119/action-ktlint@0ad7b2f5129db30cfb63fd494270c348ae5f1ad6 # v3
        with:
          report-path: build/*.xml # Support glob patterns by https://www.npmjs.com/package/@actions/glob
        continue-on-error: false # If annotations contain error of severity, action-ktlint exit 1.
  build-release-apk:
    needs: [lint]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-apk.yml
    with:
      build-type: release
    secrets:
      key-alias: ${{ secrets.KEY_ALIAS }}
      keystore: ${{ secrets.KEYSTORE_B64 }}
      key-password: ${{ secrets.KEY_PASSWORD }}
  build-app-bundle:
    needs: [lint]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-aab.yml
    secrets:
      key-alias: ${{ secrets.KEY_ALIAS }}
      keystore: ${{ secrets.KEYSTORE_B64 }}
      key-password: ${{ secrets.KEY_PASSWORD }}
  release:
    needs: [build-release-apk, build-app-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        id: download-apk
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.build-release-apk.outputs.filename }}
      - name: Download App Bundle
        id: download-bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.build-app-bundle.outputs.filename }}
      - name: Release to GitHub
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          name: "v${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dev.bluehouse.enablevolte.apk
            dev.bluehouse.enablevolte.aab
